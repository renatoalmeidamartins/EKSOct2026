apiVersion: batch/v1
kind: CronJob
metadata:
  name: my-job
  labels:
    app.kubernetes.io/name: my-cron-job
spec:
  schedule: '*/1 * * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: my-container
            image: busybox
            command:
            - date
          restartPolicy: Never
