apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    app.kubernetes.io/name: fluentbit
data:
  fluent-bit.conf: |
   [SERVICE]
      Parsers_File  parsers.conf
   [INPUT]
      Name    tail
      Tag     kube.*
      Path    var/log/containers/*.log
      Parser  docker
      DB      /var/log/flb_kube.db
